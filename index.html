<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="HKU MKTG3524 classroom game: Don't Get Caught! / 别被老师抓到">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
<title>别被老师抓到</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Fredoka:wght@500;600&family=ZCOOL+KuaiLe&display=swap">
<style>
/* Layout: one-screen classroom — HUD strip, chalkboard with professor, 3×3 grid of wooden desks as the "mole holes". Single committed look (classroom), not themed. */
:root{
  --wall:#cddfe2; --floor:#b9cdd1; --ink:#1d2a2f; --muted:#4f6168;
  --board:#2b4a3c; --frame:#7a4b2a; --frame-dk:#5a361c;
  --wood:#d59b63; --wood-dk:#9c6639; --paper:#fffaf0;
  --chalk:#f1efe4; --chalk-y:#f5d55a; --red:#df4436; --green:#2f9e5c; --amber:#f0a92b;
  --f-disp:"Fredoka","ZCOOL KuaiLe","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --f-chalk:"Caveat","ZCOOL KuaiLe","Comic Sans MS","PingFang SC",cursive;
  --f-body:system-ui,-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  color-scheme:light;
}
html{box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--wall);color:var(--ink);font-family:var(--f-body);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
button{font:inherit;color:inherit}
#app{position:relative;height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px;padding-block:10px}

/* HUD */
.hud{display:flex;align-items:center;justify-content:space-between;gap:6px;font-family:var(--f-disp)}
.chip{background:var(--paper);border:2px solid var(--ink);border-radius:12px;padding:3px 9px;display:flex;align-items:baseline;gap:6px;box-shadow:0 3px 0 var(--ink);white-space:nowrap}
.chip small{font-size:12px;letter-spacing:.06em;color:var(--muted)}
.chip b{font-size:21px;font-weight:600;font-variant-numeric:tabular-nums}
#lives{font-size:19px;color:var(--red);letter-spacing:2px}
#lives .lost{color:#c9c2b4}
#time.low{color:var(--red)}
.tools{display:flex;gap:6px}
.iconbtn{cursor:pointer;font-size:14px;font-weight:600;padding:5px 9px;align-items:center}
.iconbtn:focus-visible,.btn:focus-visible,.desk:focus-visible,#tidy:focus-visible,.seg button:focus-visible{outline:3px solid var(--chalk-y);outline-offset:2px}

/* Board */
.stage{flex:1 1 0;min-height:150px;position:relative;background:var(--board);border:8px solid var(--frame);border-bottom-width:12px;border-radius:10px;
  box-shadow:inset 0 0 50px rgba(0,0,0,.35),0 4px 0 var(--frame-dk);overflow:hidden;transition:box-shadow .2s}
.stage::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 70% 40%,rgba(255,255,255,.07),transparent 60%);pointer-events:none}
.boardtag{position:absolute;left:10px;top:6px;max-width:calc(100% - 150px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--chalk);opacity:.7;font-family:var(--f-disp);font-size:12px}
.chalk{position:absolute;left:37%;right:10px;top:28px;bottom:6px;color:var(--chalk);font-family:var(--f-chalk);font-weight:600;font-size:clamp(15px,4.4vw,22px);line-height:1.25;overflow:hidden;display:flex;flex-direction:column;gap:3px}
.chalk p{margin:0;text-shadow:0 0 2px rgba(255,255,255,.35);overflow-wrap:anywhere}
.chalk p.hd{color:var(--chalk-y)}
.status{position:absolute;right:8px;top:6px;padding:1px 10px;border-radius:999px;font-family:var(--f-disp);font-weight:600;font-size:13px;border:2px solid var(--ink);background:var(--green);color:#fff;z-index:2;white-space:nowrap}
#app[data-phase="warn"] .status{background:var(--amber);color:var(--ink);animation:blink .25s steps(2) infinite}
#app[data-phase="watch"] .status{background:var(--red)}
#app[data-phase="warn"] .stage{box-shadow:inset 0 0 0 4px var(--amber),inset 0 0 50px rgba(0,0,0,.35),0 4px 0 var(--frame-dk)}
#app[data-phase="watch"] .stage{box-shadow:inset 0 0 0 4px var(--red),inset 0 0 50px rgba(0,0,0,.35),0 4px 0 var(--frame-dk)}

/* Teacher */
.teacher{position:absolute;left:4%;bottom:0;height:88%;z-index:1}
.teacher svg{height:100%;width:auto;display:block;overflow:visible}
.teacher .tFront{display:none}
.teacher.watch .tFront{display:inline}
.teacher.watch .tBack{display:none}
.teacher.write .arm{animation:scribble .3s ease-in-out infinite alternate;transform-box:view-box;transform-origin:84px 82px}
.teacher.warn svg{animation:jitter .14s linear infinite}
.teacher.watch .eyes{animation:scan 1.1s ease-in-out infinite alternate}
.teacher.glare .face{fill:#f0a387}
.teacher.glare .eyes{animation:none}
.bubble{position:absolute;left:calc(4% + 2px);top:26px;z-index:3;background:var(--paper);border:2px solid var(--ink);border-radius:12px;padding:2px 10px;font-family:var(--f-disp);font-weight:600;font-size:15px;white-space:nowrap}
@keyframes scribble{from{transform:rotate(-7deg)}to{transform:rotate(6deg)}}
@keyframes jitter{0%{transform:translateX(-2px) rotate(-1deg)}50%{transform:translateX(2px) rotate(1deg)}100%{transform:translateX(-2px)}}
@keyframes scan{from{transform:translateX(-3px)}to{transform:translateX(3px)}}
@keyframes blink{50%{opacity:.55}}

#tidy{position:absolute;right:12px;bottom:12px;z-index:4;cursor:pointer;font-family:var(--f-disp);font-weight:600;font-size:clamp(20px,6vw,26px);
  background:var(--red);color:#fff;border:3px solid var(--ink);border-radius:16px;padding:8px 20px;box-shadow:0 5px 0 var(--ink);animation:pulse .5s ease-in-out infinite alternate;
  display:flex;flex-direction:column;align-items:center;line-height:1.1}
#tidy kbd{font-family:var(--f-body);font-size:11px;font-weight:600;opacity:.85}
#tidy:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
@keyframes pulse{to{transform:scale(1.07)}}

/* Desks */
.desks{flex:1.45 1 0;min-height:0;position:relative;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:10px;padding:10px;
  background:var(--floor);border-radius:14px;border:2px solid rgba(29,42,47,.18);transition:background .2s,box-shadow .2s}
#app[data-phase="watch"] .desks{background:#d9b4ae;box-shadow:inset 0 0 0 3px var(--red)}
#app[data-phase="warn"] .desks{background:#d9ccaa}
.desk{appearance:none;border:0;margin:0;padding:0;cursor:pointer;position:relative;display:flex;flex-direction:column;min-height:0;overflow:hidden;
  background:linear-gradient(var(--wood),#cb8f57);border-radius:8px 8px 5px 5px;box-shadow:0 4px 0 var(--wood-dk),inset 0 2px 0 rgba(255,255,255,.3)}
.desk.bump,.desk.press{transform:translateY(3px);box-shadow:0 1px 0 var(--wood-dk),inset 0 2px 0 rgba(255,255,255,.3)}
.slot{flex:1;position:relative;overflow:hidden;background:radial-gradient(ellipse 46% 26% at 50% 100%,rgba(70,35,10,.6) 0 92%,transparent 100%)}
.edge{height:22%;min-height:14px;background:var(--wood-dk);display:flex;align-items:center;justify-content:center;position:relative}
.handle{width:30%;height:4px;border-radius:2px;background:rgba(0,0,0,.35)}
.key{position:absolute;left:5px;top:50%;transform:translateY(-50%);font-family:var(--f-disp);font-weight:600;font-size:11px;line-height:1;color:var(--ink);background:rgba(255,250,240,.85);border-radius:4px;padding:2px 4px;min-width:16px;text-align:center}
@media (hover:none){.key{display:none}}
.item{position:absolute;left:50%;bottom:-2px;transform:translate(-50%,115%);transition:transform .11s ease-out;display:flex;flex-direction:column;align-items:center;gap:2px;pointer-events:none}
.desk.up .item{transform:translate(-50%,0)}
.emo{font-size:clamp(26px,8.5vw,44px);line-height:1.05;filter:drop-shadow(0 2px 0 rgba(0,0,0,.25))}
.tag{font-family:var(--f-disp);font-weight:600;font-size:12px;background:var(--paper);border:1.5px solid var(--ink);border-radius:6px;padding:0 6px 1px;position:relative;overflow:hidden;white-space:nowrap}
.tag::after{content:"";position:absolute;left:0;bottom:0;height:3px;width:100%;background:var(--green);transform-origin:left}
.desk.up .tag::after{animation:life var(--life,1500ms) linear forwards}
@keyframes life{to{transform:scaleX(0)}}

.float{position:absolute;transform:translate(-50%,0);font-family:var(--f-disp);font-weight:600;font-size:15px;white-space:nowrap;pointer-events:none;z-index:5;
  padding:1px 8px;border-radius:8px;border:2px solid var(--ink);background:var(--paper);animation:floatUp .9s ease-out forwards}
.float.good{color:var(--green)}
.float.bad{color:var(--red)}
@keyframes floatUp{from{opacity:1;transform:translate(-50%,6px) scale(.8)}20%{transform:translate(-50%,-6px) scale(1.1)}to{opacity:0;transform:translate(-50%,-34px) scale(1)}}
.toast{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);z-index:6;font-family:var(--f-disp);font-weight:600;font-size:20px;background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:4px 16px;white-space:nowrap;animation:floatUp 1s ease-out forwards;pointer-events:none}

/* Shake / flash */
#app.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.flash{position:absolute;inset:0;background:var(--red);opacity:0;pointer-events:none;z-index:15}
.flash.on{animation:flash .5s ease-out}
@keyframes flash{from{opacity:.45}to{opacity:0}}

/* Overlays */
.overlay{position:absolute;inset:0;z-index:20;display:flex;padding:12px;background:rgba(29,42,47,.55);overflow-y:auto}
.panel{background:var(--paper);border:3px solid var(--ink);border-radius:18px;box-shadow:0 6px 0 var(--ink);padding:18px;width:100%;max-width:400px;text-align:center;display:flex;flex-direction:column;gap:11px;margin:auto}
.panel h1,.panel h2{font-family:var(--f-disp);font-weight:600;margin:0;line-height:1.15;text-wrap:balance}
.panel h1{font-size:clamp(28px,9vw,40px)}
.panel h2{font-size:28px}
.panel p{margin:0;line-height:1.5}
.sub{font-family:var(--f-disp);font-weight:500;color:var(--muted);letter-spacing:.08em;font-size:15px}
.seg{display:inline-flex;align-self:center;border:2px solid var(--ink);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;cursor:pointer;padding:4px 14px;font-family:var(--f-disp);font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.rules{text-align:left;font-size:14px;display:flex;flex-direction:column;gap:6px;padding:0;margin:0;list-style:none}
.rules li{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:start}
.rules .k{font-family:var(--f-disp);font-weight:600;border:1.5px solid var(--ink);border-radius:6px;padding:0 6px;font-size:13px;white-space:nowrap}
.k.safe{background:var(--green);color:#fff}.k.warn{background:var(--amber)}.k.danger{background:var(--red);color:#fff}
.keys{display:flex;align-items:center;justify-content:center;gap:12px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.keygrid{display:grid;grid-template-columns:repeat(3,22px);gap:3px}
.keygrid span,.space{font-family:var(--f-disp);font-weight:600;font-size:12px;border:1.5px solid var(--ink);border-radius:4px;background:#fff;color:var(--ink);text-align:center;line-height:20px;box-shadow:0 2px 0 var(--ink)}
.space{padding:0 14px}
@media (hover:none){.keys{display:none}}
.legend{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.legend div{display:flex;flex-direction:column;align-items:center;font-size:12px;line-height:1.25;padding:4px 2px;border-radius:8px;background:rgba(29,42,47,.06)}
.legend span{font-size:24px}
.legend b{font-family:var(--f-disp);font-weight:600;font-variant-numeric:tabular-nums}
.legend .trap b{color:var(--red)}
.btn{cursor:pointer;font-family:var(--f-disp);font-weight:600;font-size:22px;background:var(--chalk-y);border:3px solid var(--ink);border-radius:14px;padding:9px 18px;box-shadow:0 5px 0 var(--ink)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.small{font-size:13px;color:var(--muted)}
.caught h2,.knock h2{color:var(--red)}
.stuff{font-size:30px;animation:stuff .7s ease-in infinite}
@keyframes stuff{0%{transform:translateY(-6px) rotate(-8deg)}50%{transform:translateY(4px) rotate(8deg)}100%{transform:translateY(-6px) rotate(-8deg)}}
.knock h2{font-size:34px;animation:stamp .35s ease-out 3}
@keyframes stamp{from{transform:scale(1.5)}to{transform:scale(1)}}
.loot{font-size:24px;letter-spacing:2px;word-break:break-all}
.rank{font-family:var(--f-disp);font-weight:600;font-size:clamp(30px,10vw,42px);color:var(--red)}
.big{font-family:var(--f-disp);font-weight:600;font-size:48px;line-height:1;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stats div{background:rgba(29,42,47,.06);border-radius:10px;padding:6px 2px;display:flex;flex-direction:column}
.stats b{font-family:var(--f-disp);font-weight:600;font-size:22px;font-variant-numeric:tabular-nums}
.stats small{font-size:12px;color:var(--muted)}

/* Stage banner */
.stagebanner{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:6;text-align:center;pointer-events:none;
  font-family:var(--f-disp);font-weight:600;background:var(--chalk-y);color:var(--ink);border:3px solid var(--ink);border-radius:16px;padding:6px 20px;box-shadow:0 5px 0 var(--ink);animation:banner 1.8s ease-out forwards;white-space:nowrap}
.stagebanner b{display:block;font-size:clamp(26px,8vw,34px);line-height:1.1}
.stagebanner span{font-size:14px}
@keyframes banner{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}20%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%)}}
.pips{display:inline-flex;gap:3px;margin-left:2px}
.pips i{width:7px;height:7px;border-radius:50%;border:1.5px solid var(--ink);display:inline-block}
.pips i.on{background:var(--red)}

/* Ranking */
.save{display:flex;gap:8px}
.save input{flex:1;min-width:0;font:inherit;font-size:16px;padding:8px 10px;border:2px solid var(--ink);border-radius:10px;background:#fff;color:var(--ink);-webkit-user-select:text;user-select:text}
.save input:focus-visible{outline:3px solid var(--chalk-y);outline-offset:1px}
.save .btn{font-size:16px;padding:6px 12px;box-shadow:0 3px 0 var(--ink)}
.savedmsg{font-family:var(--f-disp);font-weight:600;color:var(--green)}
.row2{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.btn.ghost{background:var(--paper);font-size:18px}
.board{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;text-align:left;max-height:46vh;overflow-y:auto}
.board li{display:grid;grid-template-columns:28px 1fr auto 52px;gap:8px;align-items:center;padding:5px 8px;border-radius:8px;background:rgba(29,42,47,.06);font-size:14px}
.board li.me{background:#fbe7a0;outline:2px solid var(--ink)}
.board .pos{font-family:var(--f-disp);font-weight:600;text-align:center}
.board li:nth-child(1) .pos{color:#c48a00}.board li:nth-child(2) .pos{color:#7b8790}.board li:nth-child(3) .pos{color:#a5602b}
.board .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board .sg{font-size:12px;color:var(--muted);white-space:nowrap}
.board .sc{font-family:var(--f-disp);font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.board .empty{display:block;text-align:center;color:var(--muted);background:none}

@media (max-height:640px){.legend{display:none}}
@media (prefers-reduced-motion:reduce){
  #app.shake,.teacher.warn svg,#tidy,.stuff,.knock h2,.teacher.write .arm,.teacher.watch .eyes{animation:none}
}
</style>
</head>
<body>


<div id="app" data-phase="write">
  <div class="hud">
    <div class="chip"><small data-t="score"></small><b id="score">0</b></div>
    <div class="chip"><span id="lives"></span></div>
    <div class="chip"><small id="stageLbl"></small><b id="time">01:30</b></div>
    <div class="tools">
      <button class="chip iconbtn" id="langBtn" type="button" aria-label="Language">EN</button>
      <button class="chip iconbtn" id="mute" type="button" aria-label="Sound">🔊</button>
    </div>
  </div>

  <div class="stage">
    <div class="boardtag" id="boardtag"></div>
    <div class="status" id="status"></div>
    <div class="chalk" id="chalk"></div>
    <div class="bubble" id="bubble" hidden></div>
    <div class="teacher write" id="teacher">
      <svg viewBox="0 0 120 180" aria-hidden="true">
        <rect x="44" y="128" width="13" height="46" rx="4" fill="#33364a"/>
        <rect x="63" y="128" width="13" height="46" rx="4" fill="#33364a"/>
        <ellipse cx="50" cy="175" rx="10" ry="5" fill="#16161d"/>
        <ellipse cx="70" cy="175" rx="10" ry="5" fill="#16161d"/>
        <g class="tBack">
          <rect x="24" y="80" width="12" height="46" rx="6" fill="#9e432e" transform="rotate(8 30 80)"/>
          <path d="M34 78 Q60 68 86 78 L92 134 Q60 142 28 134 Z" fill="#b6503a"/>
          <path d="M60 76 L60 138" stroke="#9e432e" stroke-width="2"/>
          <g class="arm">
            <path d="M84 82 L103 42" stroke="#9e432e" stroke-width="12" stroke-linecap="round"/>
            <circle cx="104" cy="38" r="6" fill="#f2c9a3"/>
            <rect x="104" y="27" width="4" height="9" rx="1" fill="#fff"/>
          </g>
          <ellipse cx="39" cy="52" rx="3" ry="5" fill="#f2c9a3"/>
          <ellipse cx="81" cy="52" rx="3" ry="5" fill="#f2c9a3"/>
          <circle cx="60" cy="27" r="10" fill="#2a211d"/>
          <circle cx="60" cy="50" r="21" fill="#2a211d"/>
          <rect x="54" y="33" width="12" height="4" rx="2" fill="#df4436"/>
        </g>
        <g class="tFront">
          <path d="M34 78 Q60 68 86 78 L92 134 Q60 142 28 134 Z" fill="#b6503a"/>
          <path d="M52 72 L60 94 L68 72 Z" fill="#fffaf0"/>
          <circle cx="60" cy="112" r="2" fill="#5a2a1d"/><circle cx="60" cy="124" r="2" fill="#5a2a1d"/>
          <rect x="30" y="96" width="60" height="13" rx="6.5" fill="#9e432e"/>
          <circle cx="32" cy="102" r="6" fill="#f2c9a3"/><circle cx="88" cy="102" r="6" fill="#f2c9a3"/>
          <rect x="55" y="66" width="10" height="10" fill="#e6b88f"/>
          <circle cx="60" cy="27" r="9" fill="#2a211d"/>
          <circle class="face" cx="60" cy="50" r="21" fill="#f2c9a3"/>
          <path d="M39 51 Q37 27 60 27 Q83 27 81 51 Q77 37 60 37 Q45 37 39 51 Z" fill="#2a211d"/>
          <g class="eyes"><circle cx="52" cy="52" r="2.2" fill="#1d2a2f"/><circle cx="68" cy="52" r="2.2" fill="#1d2a2f"/></g>
          <g stroke="#1d2a2f" stroke-width="2" fill="rgba(255,255,255,.3)">
            <circle cx="52" cy="52" r="6.5"/><circle cx="68" cy="52" r="6.5"/><line x1="58.5" y1="52" x2="61.5" y2="52"/>
          </g>
          <path d="M44 41 L57 45.5 M76 41 L63 45.5" stroke="#1d2a2f" stroke-width="2.6" stroke-linecap="round"/>
          <path d="M54 64 Q60 60.5 66 64" stroke="#1d2a2f" stroke-width="2" fill="none" stroke-linecap="round"/>
        </g>
      </svg>
    </div>
    <button id="tidy" type="button" hidden><span data-t="tidy"></span><kbd>Space</kbd></button>
  </div>

  <div class="desks" id="desks"></div>
  <div class="flash" id="flash"></div>

  <div class="overlay" id="overlay">
    <div class="panel" id="pStart">
      <div class="seg" role="group" aria-label="Language">
        <button type="button" data-lang="zh">中文</button>
        <button type="button" data-lang="en">English</button>
      </div>
      <div>
        <h1 data-t="title"></h1>
        <div class="sub" data-t="sub"></div>
      </div>
      <ul class="rules">
        <li><span class="k safe" data-t="r1k"></span><span data-t="r1"></span></li>
        <li><span class="k warn" data-t="r2k"></span><span data-t="r2"></span></li>
        <li><span class="k danger" data-t="r3k"></span><span data-t="r3"></span></li>
      </ul>
      <div class="keys">

/* Chalkboard lecture: HKU MKTG3524 Digital Marketing (taught in English, so same in both versions). "#" = heading line */
const LESSON = [
  '#MKTG3524 · Week 7',
  '#The Digital Marketing Funnel',
  'Awareness → Consideration → Conversion → Loyalty',
  'CTR = Clicks ÷ Impressions',

];

const ITEMS = {
  note:  {e:'💌', pts:10, life:1700, w:22},
  candy: {e:'🍬', pts:10, life:1700, w:22},
  comic: {e:'📖', pts:25, life:1300, w:14},

};
const POOL = [];
for (const k in ITEMS) for (let i=0;i<ITEMS[k].w;i++) POOL.push(k);

/* 3 stages of 30 s; each one is faster */
const STAGE_MS = GAME_MS/3, CLEAN_BONUS = 50;
const STAGES = [
  {write:[2600,5600], quick:.12, warn:1300, watch:[1400,2400], life:1.00, spawn:[520,720], dbl:0,   chalk:95},
  {write:[1900,4400], quick:.22, warn:1050, watch:[1300,2200], life:.85,  spawn:[400,580], dbl:.2,  chalk:70},
  {write:[1300,3400], quick:.33, warn:820,  watch:[1100,2000], life:.70,  spawn:[300,450], dbl:.35, chalk:50},
];

/* keyboard: QWE / ASD / ZXC map to the 3×3 desks; digits & numpad too */
const KEYS = ['Q','W','E','A','S','D','Z','X','C'];
const CODE_MAP = {};
KEYS.forEach((k,i)=>CODE_MAP['Key'+k]=i);
for(let i=1;i<=9;i++) CODE_MAP['Digit'+i]=i-1;
[7,8,9,4,5,6,1,2,3].forEach((n,i)=>CODE_MAP['Numpad'+n]=i);

const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};

let lang = store.get('moyu-lang') || ((navigator.language||'').toLowerCase().startsWith('zh') ? 'zh' : 'en');
const L = () => T[lang];
const iname = k => L().items[k];
const getBest=()=>+store.get('moyu-best')||0;

/* ---------- sound ---------- */
let ac=null, muted=false;
function audio(){
  if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){ac=null}}
  if(ac&&ac.state==='suspended') ac.resume().catch(()=>{});
  return ac;
}
function tone(f,d,type='sine',vol=.2,slide=1,delay=0){
  const c=audio(); if(!c||muted) return;
  const t=c.currentTime+delay, o=c.createOscillator(), g=c.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t); o.frequency.exponentialRampToValueAtTime(Math.max(20,f*slide),t+d);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+d+.03);
}
let noiseBuf=null;
function noise(d,vol,freq,delay=0){
  const c=audio(); if(!c||muted) return;
  if(!noiseBuf){noiseBuf=c.createBuffer(1,c.sampleRate*.5,c.sampleRate);const ch=noiseBuf.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=Math.random()*2-1;}
  const t=c.currentTime+delay, s=c.createBufferSource(), f=c.createBiquadFilter(), g=c.createGain();
  s.buffer=noiseBuf; f.type='lowpass'; f.frequency.value=freq;
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+d);
  s.connect(f); f.connect(g); g.connect(c.destination); s.start(t); s.stop(t+d+.02);
}
const thump=(delay,vol=.5)=>{noise(.1,vol,240,delay); tone(85,.12,'sine',vol*.7,.6,delay);};
const sfx={
  pop:p=>{tone(p>=60?900:p>=25?700:540,.1,'sine',.2,1.7); if(p>=60) tone(1300,.12,'sine',.12,1.4,.07);},
  bad:()=>tone(320,.3,'triangle',.22,.5),
  steps:()=>{thump(0);thump(.24);thump(.48);tone(1900,.03,'square',.12,1,.66);tone(1250,.04,'square',.1,1,.72);},
  turn:()=>tone(170,.18,'square',.07,.8),
  swoosh:()=>noise(.28,.35,2400),
  caught:()=>{tone(560,.2,'sawtooth',.14,.6);tone(280,.4,'sawtooth',.14,.5,.18);},
  knock:()=>{thump(0,.7);thump(.38,.7);thump(.76,.7);},
  bell:()=>[784,659,523,659].forEach((f,i)=>tone(f,.45,'sine',.14,1,i*.3)),
  levelup:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.16,'triangle',.16,1,i*.09)),
};
$('#mute').addEventListener('click',()=>{muted=!muted; $('#mute').textContent=muted?'🔇':'🔊';});

/* ---------- desks ---------- */
const desks=[];
for(let i=0;i<9;i++){
  const b=document.createElement('button');
  b.type='button'; b.className='desk';
  b.innerHTML='<span class="slot"><span class="item"><span class="emo"></span><span class="tag"></span></span></span><span class="edge"><span class="handle"></span><span class="key">'+KEYS[i]+'</span></span>';
  b.addEventListener('pointerdown',e=>{e.preventDefault(); tapDesk(i);});
  deskWrap.appendChild(b);
  desks.push({el:b, emo:b.querySelector('.emo'), tag:b.querySelector('.tag'), item:null, expire:0});
}

/* ---------- state ---------- */
let S=null;
function fresh(){return {score:0,lives:LIVES,gt:0,phase:'write',phaseEnd:0,nextSpawn:0,mode:'idle',caught:0,got:0,stash:[],li:0,ci:0,curP:null,nextChalk:0,lastSec:-1,stKey:'ready',bubKey:'write',endWhy:'endTime',stage:0,stageCaught:0,saved:false};}
const stg=()=>STAGES[S.stage];
function stageHud(){
  const lbl=$('#stageLbl');
  lbl.textContent=L().stageLbl(S.stage+1);
}
S=fresh();

function setStatus(k){S.stKey=k; statusEl.textContent=L().st[k];}
function setBubble(k){S.bubKey=k; const t=L().bub[k]; bubble.hidden=!t; bubble.textContent=t||'';}

function hud(){
  scoreEl.textContent=S.score;
  livesEl.innerHTML='♥'.repeat(Math.max(0,S.lives))+'<span class="lost">'+'♥'.repeat(LIVES-Math.max(0,S.lives))+'</span>';
}
function showPanel(id){
  overlay.hidden=!id;
  ['pStart','pCaught','pKnock','pResult','pPause','pRank'].forEach(p=>$('#'+p).hidden=(p!==id));

function applyLang(){
  const t=L();
  document.documentElement.lang = lang==='zh'?'zh-Hans':'en';
  document.querySelectorAll('[data-t]').forEach(el=>{const v=t[el.dataset.t]; if(typeof v==='string') el.textContent=v;});
  document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===lang)));
  $('#langBtn').textContent = lang==='zh'?'EN':'中';
  $('#legend').innerHTML = Object.keys(ITEMS).map(k=>{const it=ITEMS[k]; return `<div class="${it.trap?'trap':''}"><span>${it.e}</span>${iname(k)}<b>${it.pts>0?'+':''}${it.pts}</b></div>`;}).join('');
  try{ $('#boardtag').textContent=t.tag(new Date()); }catch(e){ $('#boardtag').textContent='HKU · MKTG3524'; }
  desks.forEach((d,i)=>{ d.el.setAttribute('aria-label',t.desk(i+1)+' ('+KEYS[i]+')'); if(d.item) d.tag.textContent=iname(d.item); });
  const b=getBest(); $('#bestStart').textContent=b?t.best(b):'';
  setStatus(S.stKey); setBubble(S.bubKey);
  stageHud();
  $('#nick').placeholder=t.nickPh;
  if(!$('#pResult').hidden) fillResult(true);
  renderBoard();
}
function setLang(l){ if(l!==lang){ lang=l; store.set('moyu-lang',l); applyLang(); } }
document.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.lang)));
$('#langBtn').addEventListener('click',()=>setLang(lang==='zh'?'en':'zh'));

/* ---------- phases ---------- */
function setPhase(p,dur){
  S.phase=p; S.phaseEnd=S.gt+dur;
  teacher.className='teacher '+p;
  app.dataset.phase=p;
  tidyBtn.hidden=(p!=='warn');
  setBubble(p); setStatus(p);
}
function toWrite(first){
  const c=stg();
  const d = first ? rand(3200,4200) : (Math.random()<c.quick ? rand(800,1500) : rand(c.write[0],c.write[1]));
  setPhase('write',d);
  S.nextSpawn=S.gt+200;
}
function toWarn(){ setPhase('warn',stg().warn); sfx.steps(); }
function stageUp(n){
  S.stage=n; stageHud();
  const t=L();
  let sub=t.stageSub[n];
  if(S.stageCaught===0){ S.score+=CLEAN_BONUS; hud(); sub=t.clean(CLEAN_BONUS)+' · '+sub; }
  S.stageCaught=0;
  const b=document.createElement('div'); b.className='stagebanner';
  const h=document.createElement('b'); h.textContent=t.stageUp(n+1);
  const s=document.createElement('span'); s.textContent=sub;
  b.append(h,s); document.querySelector('.stage').appendChild(b);
  setTimeout(()=>b.remove(),1900);
  sfx.levelup();
}
function toWatch(){
  const left=desks.filter(d=>d.item&&!ITEMS[d.item].trap);
  if(left.length){ const k=left[0].item; catchMe(L().whyLeft(iname(k),ITEMS[k].e), ITEMS[k].e); return; }
  setPhase('watch',rand(stg().watch[0],stg().watch[1])); sfx.turn();
}

function hideItem(d){ d.item=null; d.el.classList.remove('up'); }
function spawnOne(){
  const empty=desks.filter(d=>!d.item); if(!empty.length) return;
  const d=pick(empty), k=pick(POOL), it=ITEMS[k];
  const life=it.life*stg().life;
  d.item=k; d.expire=S.gt+life;
  d.emo.textContent=it.e; d.tag.textContent=iname(k);
  d.el.style.setProperty('--life',life+'ms');
  d.el.classList.remove('up'); void d.el.offsetWidth; d.el.classList.add('up');
}

function floatAt(d,text,cls){
  const f=document.createElement('div');
  f.className='float '+cls; f.textContent=text;
  f.style.left=(d.el.offsetLeft+d.el.offsetWidth/2)+'px';
  f.style.top=(d.el.offsetTop+d.el.offsetHeight*.15)+'px';
  deskWrap.appendChild(f); setTimeout(()=>f.remove(),950);
}
function toast(text){
  const t=document.createElement('div'); t.className='toast'; t.textContent=text;
  deskWrap.appendChild(t); setTimeout(()=>t.remove(),1000);
}

function tapDesk(i){
  audio();
  if(S.mode!=='play') return;
  const d=desks[i];
  if(S.phase==='watch'){
    catchMe(d.item?L().whyGrab(iname(d.item)):L().whyHand, d.item?ITEMS[d.item].e:'✋');
    return;
  }
  if(!d.item){ d.el.classList.add('bump'); setTimeout(()=>d.el.classList.remove('bump'),120); return; }
  const it=ITEMS[d.item];
  if(it.trap){
    S.score=Math.max(0,S.score+it.pts);
    floatAt(d,L().trap(it.pts,iname(d.item)),'bad'); sfx.bad();
  }else{
    S.score+=it.pts; S.got++; S.stash.push(it.e);
    floatAt(d,L().plus(it.pts),'good'); sfx.pop(it.pts);
  }
  hideItem(d); hud();
}

function tidy(){
  if(S.mode!=='play'||S.phase!=='warn') return;
  desks.forEach(d=>{ if(d.item) hideItem(d); });
  tidyBtn.hidden=true; sfx.swoosh(); toast(L().tidied);
}
tidyBtn.addEventListener('pointerdown',e=>{e.preventDefault(); audio(); tidy();});

function catchMe(why,emoji){
  S.lives--; S.caught++; S.stageCaught++; S.mode='caught';
  teacher.className='teacher watch glare'; app.dataset.phase='watch';
  tidyBtn.hidden=true; setBubble('caught'); setStatus('caught');
  desks.forEach(d=>{ if(d.item) hideItem(d); });
  app.classList.remove('shake'); void app.offsetWidth; app.classList.add('shake');
  flash.classList.remove('on'); void flash.offsetWidth; flash.classList.add('on');
  sfx.caught(); hud();
  $('#caughtWhy').textContent=why;
  $('#caughtStuff').textContent=(emoji||'🙈')+' → 🗄️';
  $('#caughtLives').textContent=L().livesLeft(S.lives);
  showPanel('pCaught');
  setTimeout(()=>{
    app.classList.remove('shake');
    if(S.lives<=0){ gameOver('lives'); return; }
    showPanel(null); S.mode='play'; toWrite();
  },1800);
}

function gameOver(why){
  S.mode='over'; tidyBtn.hidden=true;
  desks.forEach(d=>{ if(d.item) hideItem(d); });
  store.set('moyu-best',String(Math.max(getBest(),S.score)));
  if(why==='lives'){
    S.endWhy='endLives';
    teacher.className='teacher watch glare'; setBubble('confiscate');
    $('#loot').textContent=S.stash.length?S.stash.slice(-16).join(''):L().lootEmpty;
    showPanel('pKnock'); sfx.knock();
    setTimeout(()=>{fillResult(); showPanel('pResult');},2300);
  }else{
    S.endWhy='endTime';
    teacher.className='teacher watch'; app.dataset.phase='watch'; setBubble('bell'); setStatus('over');
    sfx.bell(); setTimeout(()=>{fillResult(); showPanel('pResult');},900);
  }
}
function fillResult(keepForm){
  const t=L(), s=S.score;
  const r=t.ranks[s>=1000?2:s>=450?1:0];
  $('#resWhy').textContent=t[S.endWhy]; $('#rank').textContent=r[0]; $('#resScore').textContent=s; $('#rankLine').textContent=r[1];
  $('#stGot').textContent=S.got; $('#stCaught').textContent=S.caught; $('#stStage').textContent=t.stageCol(S.stage+1);
  const b=getBest(); $('#bestStart').textContent=b?t.best(b):'';
  if(!keepForm){
    $('#saveForm').hidden=false; $('#savedMsg').hidden=true;
    $('#nick').value=store.get('moyu-nick')||'';
  }else if(S.savedMsg){ $('#savedMsg').textContent=S.savedMsg(); }
}

/* ---------- leaderboard ---------- */
const clean=s=>String(s||'').replace(/[\u0000-\u001f<>]/g,'').trim().slice(0,12);
function localBoard(){ try{ const a=JSON.parse(store.get('moyu-board')||'[]'); return Array.isArray(a)?a:[]; }catch(e){ return []; } }
let db=null, canWrite=false, online=[], onlineState='loading', tab='online', myId=null;

async function initOnline(){
  try{
    if(!window.claude||typeof window.claude.use!=='function'){ onlineState='off'; tab='local'; $('#tabs').hidden=true; renderBoard(); return; }
    const [d,u]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    db=d;
    if(!db){ onlineState='off'; renderBoard(); return; }
    const w=u?await u.can('data.write'):null;
    canWrite = (w!==false);
    db.collection('scores').orderBy('score','desc').limit(10).onSnapshot(snap=>{
      online=snap.docs.map(x=>Object.assign({_id:x.id},x.data()));
      onlineState='ok'; renderBoard();
    },()=>{ onlineState='off'; renderBoard(); });
  }catch(e){ onlineState='off'; renderBoard(); }
}

function renderBoard(){
  const t=L();
  const useOnline = tab==='online' && onlineState==='ok';
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.tab===(useOnline?'online':'local'))));
  const rows = useOnline ? online : localBoard();
  const ol=$('#board'); ol.innerHTML='';
  if(!rows.length){ const li=document.createElement('li'); li.className='empty'; li.textContent=t.empty; ol.appendChild(li); }
  rows.slice(0,10).forEach((r,i)=>{
    const li=document.createElement('li');
    if(myId && (r._id===myId || r.id===myId)) li.className='me';
    const cells=[['pos',String(i+1)],['nm',clean(r.name)||t.anon],['sg',t.stageCol(Math.min(3,Math.max(1,+r.stage||1)))],['sc',String(Math.max(0,+r.score||0))]];
    cells.forEach(([c,v])=>{const s=document.createElement('span'); s.className=c; s.textContent=v; li.appendChild(s);});
    ol.appendChild(li);
  });
  let note;
  if(tab==='local' || onlineState!=='ok') note = (tab==='online' && onlineState==='off') ? t.noteOff : t.noteLocal;
  else note = canWrite ? t.noteSync : t.noteRead;
  $('#boardNote').textContent=note;
}

async function saveScore(e){
  e.preventDefault();
  if(S.saved) return;
  S.saved=true;
  const t=L(), name=clean($('#nick').value)||t.anon;
  store.set('moyu-nick',name);
  const entry={name, score:S.score, stage:S.stage+1, ts:Date.now()};
  const id='l'+entry.ts+Math.random().toString(36).slice(2,6);
  const lb=localBoard(); lb.push(Object.assign({id},entry));
  lb.sort((a,b)=>b.score-a.score||a.ts-b.ts);
  store.set('moyu-board',JSON.stringify(lb.slice(0,10)));
  myId=id;
  let onlineRank=0;
  if(db && canWrite){
    try{
      const ref=db.collection('scores').doc(id);
      await ref.set(entry);
      const higher=await db.collection('scores').where('score','>',entry.score).get();
      onlineRank=higher.size+1;
    }catch(err){ if(err&&err.code==='invalid_argument') canWrite=false; }
  }
  const localRank=lb.slice(0,10).findIndex(x=>x.id===id)+1;
  S.savedMsg = () => onlineRank&&onlineRank<=10 ? L().saved(onlineRank,true) : localRank ? L().saved(localRank,false) : L().savedOut;
  $('#saveForm').hidden=true;
  $('#savedMsg').textContent=S.savedMsg(); $('#savedMsg').hidden=false;
  tab = onlineRank ? 'online' : 'local';
  renderBoard();
}
$('#saveForm').addEventListener('submit',saveScore);

let rankReturn='pStart';
function openRank(from){ rankReturn=from; if(onlineState!=='ok' && tab==='online') tab='local'; renderBoard(); showPanel('pRank'); }
$('#rankBtn1').addEventListener('click',()=>{ tab=onlineState==='ok'?'online':'local'; openRank('pStart'); });
$('#rankBtn2').addEventListener('click',()=>openRank('pResult'));
$('#rankBack').addEventListener('click',()=>showPanel(rankReturn));
document.querySelectorAll('#tabs button').forEach(b=>b.addEventListener('click',()=>{ tab=b.dataset.tab; renderBoard(); }));

function start(){
  audio();
  S=fresh(); S.mode='play'; myId=null;
  chalkEl.innerHTML=''; desks.forEach(hideItem); hud(); stageHud();
  timeEl.textContent='01:30'; timeEl.classList.remove('low');
  showPanel(null); toWrite(true);
  last=0;
}
$('#startBtn').addEventListener('click',start);
$('#againBtn').addEventListener('click',start);
$('#resumeBtn').addEventListener('click',()=>{audio(); if(S.mode==='paused'){S.mode='play'; showPanel(null); last=0;}});

document.addEventListener('visibilitychange',()=>{
  if(document.hidden&&S.mode==='play'){ S.mode='paused'; showPanel('pPause'); }
});

document.addEventListener('keydown',e=>{
  if(e.repeat||e.ctrlKey||e.metaKey||e.altKey) return;
  if(e.target&&(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')) return;
  if(!$('#pRank').hidden) return;
  if(e.code==='Space'){
    if(S.mode==='play'){ e.preventDefault(); audio(); tidy(); }
    else if(!$('#pStart').hidden || !$('#pResult').hidden){ e.preventDefault(); start(); }
    return;
  }
  const i=CODE_MAP[e.code];
  if(i!==undefined&&S.mode==='play'){
    e.preventDefault();
    const el=desks[i].el; el.classList.add('press'); setTimeout(()=>el.classList.remove('press'),110);
    tapDesk(i);
  }
});

/* chalk writing: types the lecture letter by letter, erases the oldest line when the board is full */
function chalkTick(){
  if(S.gt<S.nextChalk) return;
  S.nextChalk=S.gt+stg().chalk;
  let raw=LESSON[S.li%LESSON.length];
  const hd=raw.startsWith('#'); if(hd) raw=raw.slice(1);
  const line=[...raw];
  if(S.ci===0){
    S.curP=document.createElement('p'); if(hd) S.curP.className='hd'; chalkEl.appendChild(S.curP);
  }
  S.ci++; S.curP.textContent=line.slice(0,S.ci).join('');
  while(chalkEl.scrollHeight>chalkEl.clientHeight+1 && chalkEl.children.length>1) chalkEl.firstElementChild.remove();
  if(S.ci>=line.length){ S.li++; S.ci=0; S.nextChalk=S.gt+420; }
}

/* main loop */
let last=0;
function frame(t){
  requestAnimationFrame(frame);
  const dt=last?Math.min(50,t-last):16; last=t;
  if(S.mode!=='play') return;
  S.gt+=dt;
  const remain=Math.max(0,GAME_MS-S.gt), sec=Math.ceil(remain/1000);
  if(sec!==S.lastSec){ S.lastSec=sec; timeEl.textContent=`${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`; timeEl.classList.toggle('low',sec<=10); }
  if(remain<=0){ gameOver('time'); return; }
  const ns=Math.min(2,Math.floor(S.gt/STAGE_MS));
  if(ns>S.stage) stageUp(ns);
  for(const d of desks) if(d.item&&S.gt>=d.expire) hideItem(d);
  if(S.phase==='write'){
    if(S.gt>=S.nextSpawn){
      const c=stg();
      spawnOne(); if(Math.random()<c.dbl) spawnOne();
      S.nextSpawn=S.gt+rand(c.spawn[0],c.spawn[1]);
    }
    chalkTick();
    if(S.gt>=S.phaseEnd) toWarn();
  }else if(S.phase==='warn'){
    if(S.gt>=S.phaseEnd) toWatch();
  }else if(S.phase==='watch'){
    if(S.gt>=S.phaseEnd) toWrite();
  }
}

/* idle board shows the lecture header before class starts */
['#MKTG3524 · Digital Marketing','Welcome to HKU Business School'].forEach(s=>{const p=document.createElement('p'); if(s[0]==='#'){p.className='hd';s=s.slice(1);} p.textContent=s; chalkEl.appendChild(p);});
hud();
applyLang();
showPanel('pStart');
initOnline();
requestAnimationFrame(frame);
})();
